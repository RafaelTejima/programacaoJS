<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
</head>
<body>
    
    <h1>CRUD</h1>
    <p>Create (inserir) </p>
    <p>Read (buscar) </p>
    <p>Update (alterar) </p>
    <p>Delete (remover) </p>

    <hr/>

    <input placeholder="Digite um nome" id="inputNome"/>
    <button id="inserirSalvar" onclick="inserir()" >Salvar</button>
    <button id="salvarAlterações" onclick="salvarAlteracao()" style="display: none;">Salvar Alterações</button>

    <ul id="listaUsuarios">
      
    </ul>

    <script>

        // Dados mockados
        let nomes = ["Conrado", "Caio", "Felipe", "Rafael"] // Array

        let posicaoAlteracao = 0 


        buscarTodos()

        function remover(nome){
            let resposta = confirm("Tem certeza que deseja remover?")
            if(resposta == false)
                return

            let posicaoRemocao = nomes.indexOf(nome)
            nomes.splice(posicaoRemocao, 1)
            buscarTodos()
        }

        function salvarAlteracao(){
            let nome = document.getElementById("inputNome").value

            if(nome.length < 0){
                alert("Por favor, insira um nome")
                return
            }
            
            nomes[posicaoAlteracao] = nome
            buscarTodos()
            document.getElementById("inputNome").value = ""

             document.getElementById("inserirSalvar").style.display = "inline-block"
            document.getElementById("salvarAlterações").style.display = "none"
        }

        function atualizar(nome){

            posicaoAlteracao = nomes.indexOf(nome)

            nome = document.getElementById("inputNome").value = nome

            document.getElementById("inserirSalvar").style.display = "none"
            document.getElementById("salvarAlterações").style.display = "inline-block"

            }


        function inserir(){
            let nome = document.getElementById("inputNome").value

            if(nome.length < 3){
                alert("Por favor, insira um nome")
                return
            }
            
            nomes = nomes.concat(nome)
            buscarTodos()
            document.getElementById("inputNome").value = ""
        }

        function buscarTodos(){
            
            let html = ""
            nomes.map( i => html += `<li> ${i} <button onclick='atualizar("${i}")'>🖊</button> <button onclick='remover("${i}")' >🗑</button> </li>` )
            document.getElementById("listaUsuarios").innerHTML = html

        }

    </script>















</body>
</html>
