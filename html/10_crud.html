<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
</head>
<body>
    
    <h1>CRUD</h1>
    <p>Create (inserir) </p>
    <p>Read (buscar) </p>
    <p>Update (alterar) </p>
    <p>Delete (remover) </p>

    <hr/>

    <input placeholder="Digite um nome" id="inputNome"/>
    <button onclick="inserir()" >Salvar</button>

    <ul id="listaUsuarios">
      
    </ul>

    <script>

        // Dados mockados
        let nomes = ["Conrado", "Caio", "Felipe", "Rafael"] // Array

        buscarTodos()

        function inserir(){
            let nome = document.getElementById("inputNome").value
            if(nome.length == 0){
                alert("Por favor, insira um nome")
                return
            }
            
            nomes = nomes.concat(nome)
            buscarTodos()
            document.getElementById("inputNome").value = ""
        }

        function buscarTodos(){
            
            let html = ""
            nomes.map( i => html += "<li> "+i+" <button>🖊</button> " + " <button>🗑</button> "+" </li>" )
            document.getElementById("listaUsuarios").innerHTML = html

        }

    </script>















</body>
</html>
